# Aplicar SOLO en el Argo CD del cluster AKS:
#
#   kubectl apply -f bootstrap/applicationset-aks.yaml
#
# NO instala Argo CD - asume que ya esta instalado (ver azure-aks-cluster).
# Ver bootstrap/applicationset-eks.yaml para el motivo real del split
# eks/aks (no es un simple rename de "dev").
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: k8s-apps-aks
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/jalcalaroot/k8s-apps.git
        revision: main
        directories:
          - path: apps/*/overlays/aks
  template:
    metadata:
      # path.basenameNormalized = "aks" para todas, asi que se usa
      # path[1] (el nombre de la app) como nombre de la Application.
      name: "{{path[1]}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/jalcalaroot/k8s-apps.git
        targetRevision: main
        path: "{{path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
