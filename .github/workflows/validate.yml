name: Validate manifests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # subir el SARIF de Checkov a la pestaña Security

jobs:
  validate:
    name: kustomize build + kubeconform + Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # kubectl trae kustomize integrado (kubectl kustomize) - sin
      # dependencias extra para el build en si.
      - name: Descargar kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform

      # Cada overlay se compila y valida por separado - un error en una app
      # no debe tapar el de otra, y el output deja claro cual overlay fallo.
      # -ignore-missing-schemas: necesario para CRDs (ej. la Application/
      # ApplicationSet de Argo en bootstrap/) que no tienen schema publico
      # conocido - se saltean en vez de fallar. El mismo render (kustomize
      # build) tambien se guarda en rendered/ para que Checkov escanee eso
      # despues, no los fragmentos crudos - ver el paso de Checkov abajo.
      - name: kustomize build + kubeconform (cada overlay)
        run: |
          set -e
          mkdir -p rendered
          for overlay in apps/*/overlays/*/; do
            if [ -f "$overlay/kustomization.yaml" ]; then
              echo "== $overlay =="
              name=$(echo "$overlay" | tr '/' '-')
              kubectl kustomize "$overlay" | tee "rendered/${name}.yaml" | ./kubeconform -strict -ignore-missing-schemas -summary
            fi
          done

      - name: kubeconform (bootstrap/, manifiestos planos)
        run: ./kubeconform -strict -ignore-missing-schemas -summary bootstrap/*.yaml apps/headlamp/extra/*.yaml

      # Checkov escanea SOLO el output ya renderizado por kustomize
      # (rendered/) mas los manifiestos planos (bootstrap/, apps/*/extra/)
      # - nunca la fuente cruda de apps/*/base|overlays. Un patch de
      # Kustomize (ej. apps/*/overlays/*/patch-*.yaml) es un fragmento
      # PARCIAL a proposito (solo el campo que cambia, ej. nodeSelector) -
      # escanearlo crudo como si fuera un Deployment completo genera
      # falsos positivos masivos (le faltan securityContext, resources,
      # etc. que SI estan en el recurso real una vez que Kustomize aplica
      # el patch). Encontrado a mano: agregar mas #checkov:skip no
      # arreglaba nada porque el hallazgo apuntaba al archivo de patch,
      # no al recurso real ya fusionado.
      #
      # bootstrap/ y apps/headlamp/extra/ se copian TAMBIEN a rendered/
      # antes de correr Checkov - el input `directory` de este Action
      # pasa el string tal cual a `checkov -d`, sin splitear por coma
      # (confirmado corriendo esto en CI: "Directory rendered,bootstrap,...
      # does not exist" - Checkov silenciosamente escaneaba 0 archivos y
      # el job pasaba en falso, sin haber corrido ni un check). Un solo
      # directorio real, no una lista.
      - name: Copiar manifiestos planos a rendered/
        run: |
          cp bootstrap/*.yaml rendered/
          cp apps/headlamp/extra/*.yaml rendered/

      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          directory: rendered
          framework: kubernetes
          quiet: true
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Subir resultados de Checkov a la pestaña Security
        if: always() && steps.checkov.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
