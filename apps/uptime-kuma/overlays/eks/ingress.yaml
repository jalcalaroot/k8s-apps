# Ver apps/podinfo/overlays/eks/ingress.yaml para el motivo del patron
# (ALB compartido, cert ACM real de aws-eks-cluster). Backend port 3001,
# no 80 - unica diferencia real con las otras 2 apps.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  annotations:
    checkov.io/skip1: "CKV_K8S_21=namespace default a proposito, mismo criterio que el resto de este repo - ver CLAUDE.md"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:740104998573:certificate/e52bf361-4785-41c7-8cf7-49804295268e
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/group.name: eks-demo-apps
spec:
  ingressClassName: alb
  rules:
    - host: uptime-kuma.aws.jalcalaroot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 3001
