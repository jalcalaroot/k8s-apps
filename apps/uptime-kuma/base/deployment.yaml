# Uptime Kuma (github.com/louislam/uptime-kuma) - dashboard de monitoreo
# que puede vigilar de verdad a hello-world/Argo CD/2048 una vez arriba,
# no es puramente decorativo (mismo criterio que documenta CLAUDE.md).
#
# SIN KEDA/autoescalado horizontal a proposito - no es un descuido. Esta
# imagen guarda sus datos (monitores, historial, usuarios) en un SQLite
# local (/app/data), sin soporte de clustering/DB externa documentado en
# el proyecto. Escalar a N réplicas significaría N bases de datos
# independientes: cada réplica vería un set distinto de monitores segun
# a cual la haya tocado el balanceador - no es "autoescalado", es romper
# la app. replicas: 1 fijo. Ver README para el detalle de las 3 apps.
#
# Corre SIN root. La version anterior corria como root porque el
# entrypoint de la imagen (extra/entrypoint.sh, leido de la imagen real)
# hace `chown -hRc $PUID:$PGID /app/data` y despues
# `exec setpriv --reuid $PUID --regid $PGID ...` - con PUID/PGID default 0,
# o sea que node terminaba corriendo como root de todas formas, y el
# chown/setpriv obligaba a agregar CHOWN/SETUID/SETGID. Ahora se saltea ese
# entrypoint (command/args abajo arrancan node directo bajo dumb-init, igual
# que el CMD de la imagen) y el pod corre como UID 65534 sin ninguna
# capability. No hace falta el chown: /app/data es un emptyDir (0777).
# Probado con la imagen real (mismo digest) antes de escribir esto:
# `docker run --read-only --user 65534:65534 --cap-drop ALL
# --security-opt no-new-privileges` con /app/data como tmpfs crea kuma.db,
# aplica las migraciones y responde 302 -> /dashboard en /, y tambien en un
# cluster kind local con exactamente este manifiesto renderizado. Unico
# mensaje nuevo en el log: "Failed to start nscd" (cache de DNS opcional
# que la app intenta levantar; sin el sigue resolviendo DNS normal) - y
# no es nuevo: con la config anterior (root + CHOWN/SETUID/SETGID +
# readOnlyRootFilesystem) tambien fallaba igual, confirmado corriendo
# ambas versiones contra la misma imagen.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  labels:
    app: uptime-kuma
  annotations:
    checkov.io/skip1: "CKV_K8S_21=namespace default a proposito, mismo criterio que podinfo - ver CLAUDE.md"
    checkov.io/skip2: "CKV2_K8S_6=NetworkPolicy no verificado en Fargate/ACI, mismo motivo que podinfo"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
      annotations:
        checkov.io/skip1: "CKV2_K8S_6=NetworkPolicy no verificado en Fargate/ACI, mismo motivo que podinfo"
    spec:
      # uptime-kuma no habla con la API de Kubernetes (monitorea por
      # HTTP/TCP/DNS, no via kube-apiserver).
      automountServiceAccountToken: false
      # Mismo criterio que podinfo: UID/GID alto no-root (CKV_K8S_40,
      # 65534 = "nobody", ya existe en la imagen) y seccomp RuntimeDefault.
      # Todo /app es root:root 0755/0644 en la imagen - legible por
      # cualquier UID, verificado con ls -la contra la imagen.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: uptime-kuma
          # Tag + digest (CKV_K8S_43): "1" es un tag movil (hoy apunta a
          # 1.23.17) - el digest fija exactamente esa build. Es el digest del
          # indice multi-arch del tag, resuelto con
          # `docker buildx imagetools inspect louislam/uptime-kuma:1`. Al
          # actualizar, cambiar el digest (y el tag si se pasa a 2.x).
          image: louislam/uptime-kuma:1@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
          imagePullPolicy: Always
          # Saltea extra/entrypoint.sh (chown + setpriv, ver arriba) - mismo
          # ENTRYPOINT (dumb-init como PID 1, para reenviar señales a node)
          # y mismo CMD que la imagen, sin el paso intermedio que necesita
          # root.
          command: ["/usr/bin/dumb-init", "--"]
          args: ["node", "server/server.js"]
          ports:
            - name: http
              containerPort: 3001
          # / redirige a /setup o /dashboard segun el estado - 200-399
          # cuenta como probe exitoso, no hace falta un endpoint dedicado.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 100m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # Sin entrypoint (chown/setpriv) no hace falta ninguna
            # capability - antes eran CHOWN, SETUID y SETGID.
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        # emptyDir, no PVC a proposito - PVC en Fargate/ACI es un gotcha ya
        # evitado en otras apps de este cluster (ver CLAUDE.md de
        # azure-aks-cluster sobre Kubernetes Dashboard). Consecuencia real:
        # los monitores configurados se pierden si el pod se reprograma -
        # aceptable para un demo, documentado a proposito en vez de
        # descubierto en produccion.
        - name: data
          emptyDir: {}
