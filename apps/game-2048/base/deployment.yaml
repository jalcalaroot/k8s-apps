# 2048 (github.com/aws-samples/eks-workshop-samples, imagen
# public.ecr.aws/l6m2t8p7/docker-2048) - la app de referencia del propio
# EKS Workshop de AWS para probar Ingress/ALB. Se usa acá por el mismo
# motivo que podinfo: es "de verdad" (jugable), no un placeholder, y no
# hace falta mantener un Dockerfile propio.
#
# La imagen es un nginx 1.20.1 sobre Alpine 3.14, de hace ~4 años, sin
# URL/health endpoint propios y pensada para correr como root (nginx.conf
# con "user nginx;", listen 80, rutas fijas bajo /var/lib/nginx y
# /run/nginx).
#
# Historia (por que esto ya no corre como root): la version anterior de
# este Deployment corria nginx como root con el nginx.conf de la imagen, y
# eso arrastraba una cadena de parches - con capabilities.drop=ALL root
# pierde CAP_DAC_OVERRIDE y en EKS Fargate no podia ni transitar
# /var/lib/nginx (drwxr-x--- nginx:nginx), lo que obligo a un initContainer
# (init-nginx-dirs) + restaurar el set default de capabilities de Docker
# (CHOWN, SETUID, SETGID, DAC_OVERRIDE...) para el chown/setuid interno de
# nginx al bajar a su worker. Ademas ACI (AKS Virtual Nodes) no soporta
# initContainers (ver CLAUDE.md, seccion KEDA).
#
# Ahora: nginx corre directamente como UID 65534 (nobody) con un nginx.conf
# propio (nginx.conf en este mismo directorio, montado via ConfigMap) que
# escucha en 8080 y escribe solo en /tmp (emptyDir). Sin root no hay
# chown/setuid que hacer, asi que no hace falta NINGUNA capability ni el
# initContainer. Probado con la imagen real (mismo digest) antes de
# escribir esto: `docker run --read-only --user 65534:65534 --cap-drop ALL
# --security-opt no-new-privileges` con /tmp como tmpfs sirve el juego
# (200 en / y en los .js/.css, 404 en rutas inexistentes), y tambien en un
# cluster kind local con exactamente este manifiesto renderizado.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "game-2048"
  labels:
    app: "game-2048"
  annotations:
    checkov.io/skip1: "CKV_K8S_21=namespace default a proposito, mismo criterio que podinfo - ver CLAUDE.md"
    checkov.io/skip2: "CKV2_K8S_6=NetworkPolicy no verificado en Fargate/ACI, mismo motivo que podinfo"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "game-2048"
  template:
    metadata:
      labels:
        app: "game-2048"
      annotations:
        checkov.io/skip1: "CKV2_K8S_6=NetworkPolicy no verificado en Fargate/ACI, mismo motivo que podinfo"
    spec:
      # 2048 es un sitio estatico, no habla con la API de Kubernetes.
      automountServiceAccountToken: false
      # Mismo criterio que podinfo: UID/GID alto no-root (CKV_K8S_40,
      # 65534 = "nobody", ya existe en la imagen) y seccomp RuntimeDefault.
      # Los archivos que nginx lee (/usr/share/nginx/html, /etc/nginx/
      # mime.types) son root:root 0644/0755 en la imagen - legibles por
      # cualquier UID, verificado con ls -la contra la imagen.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: "game-2048"
          # Esta imagen solo publica el tag latest (confirmado contra la API
          # del registry, no hay tag versionado) - se fija por digest
          # (CKV_K8S_43/CKV_K8S_14) para que un push nuevo a latest no
          # cambie lo que corre sin pasar por un PR. Digest resuelto con
          # `docker buildx imagetools inspect public.ecr.aws/l6m2t8p7/docker-2048:latest`
          # (manifest unico linux/amd64, no hay multi-arch).
          image: public.ecr.aws/l6m2t8p7/docker-2048:latest@sha256:338a89c44a060734afb446950fbbcd804a005daf7af38def7c496967fa4ab965
          imagePullPolicy: Always
          # -c: nginx.conf propio (ConfigMap). -e stderr: el error_log que
          # nginx abre ANTES de leer el config (ruta compilada,
          # /var/lib/nginx/logs/error.log) va a stderr en vez de intentar
          # escribir en el filesystem read-only.
          command: ["nginx", "-c", "/etc/nginx/k8s/nginx.conf", "-e", "stderr", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          # memory 100Mi, no 64Mi - encontrado a mano en AKS: ACI convierte
          # Mi a GB con solo 1 decimal de precision, y 64Mi = 0.0625 GB
          # trunca a 0.0 GB. ACI rechaza el pod entero con "ResourceNegativeOrZero"
          # porque memoryInGB tiene que ser positivo. 100Mi = 0.1048 GB
          # sobrevive el truncamiento (queda en 0.1). Mismo tipo de bug que
          # el truncamiento de memoria ya documentado para el initContainer
          # de Argo CD en aws-eks-cluster/azure-aks-cluster.
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 50m
              memory: 100Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/k8s
              readOnly: true
            # Unica ruta escribible: pid + *_temp_path (ver nginx.conf).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: game-2048-nginx
        - name: tmp
          emptyDir: {}
