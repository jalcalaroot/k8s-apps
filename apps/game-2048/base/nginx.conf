# nginx.conf propio para correr la imagen de 2048 SIN root (montado via
# ConfigMap, ver deployment.yaml). Mismo contenido funcional que el
# /etc/nginx/nginx.conf + /etc/nginx/http.d/default.conf de la imagen
# (Alpine 3.14, nginx 1.20.1 - leidos de la imagen real, no asumidos), con
# solo lo minimo cambiado para no necesitar privilegios:
#   - sin directiva "user" (solo tiene sentido si el master corre como root)
#   - listen 8080 en vez de 80 (un usuario no-root no puede bindear <1024
#     sin CAP_NET_BIND_SERVICE) - el Service sigue exponiendo el puerto 80
#   - pid y todos los *_temp_path en /tmp (emptyDir) en vez de /run/nginx y
#     /var/lib/nginx/tmp (rutas de la imagen, propiedad de root/nginx)
#   - logs a stdout/stderr en vez de /var/log/nginx (y kubectl logs los ve)
#   - worker_processes 1 en vez de auto: con limit de 50m de CPU mas
#     workers no suman nada, y "auto" en Fargate/ACI cuenta las CPUs del
#     host, no las del pod - solo gasta memoria contra el limit de 100Mi
# Sin "listen [::]:8080" a proposito: los probes y el ALB/AppGW llegan por
# IPv4, y si el pod no tiene IPv6 ese listen hace fallar el arranque.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
pcre_jit on;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	server_tokens off;
	sendfile on;
	tcp_nopush on;
	access_log /dev/stdout;

	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;

	server {
		listen 8080 default_server;

		location / {
			root /usr/share/nginx/html;
		}

		location = /404.html {
			internal;
		}
	}
}
