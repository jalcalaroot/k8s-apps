# Ver apps/podinfo/overlays/aks/patch-virtual-node.yaml para el motivo -
# mismo patron (nodeSelector/tolerations a nivel pod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-2048
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/role: agent
        type: virtual-kubelet
      tolerations:
        - key: virtual-kubelet.io/provider
          operator: Exists
        - key: azure.com/aci
          effect: NoSchedule
