# Mismo Application Gateway multi-site que hello-world/argocd
# (azure-aks-cluster/k8s/ingress.yaml) - un host mas, no un AppGW nuevo.
# El TLS Secret "podinfo-tls" se crea a mano (mismo flujo que hello-world:
# terraform output demo_apps_certificate_pem/_private_key_pem en
# azure-aks-cluster -> kubectl create secret tls), no lo gestiona Kustomize.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  annotations:
    checkov.io/skip1: "CKV_K8S_21=namespace default a proposito, mismo criterio que el resto de este repo - ver CLAUDE.md"
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: azure-application-gateway
  tls:
    - hosts:
        - podinfo.azure.jalcalaroot.com
      secretName: podinfo-tls
  rules:
    - host: podinfo.azure.jalcalaroot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podinfo
                port:
                  number: 80
