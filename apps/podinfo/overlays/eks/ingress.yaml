# Mismo ALB compartido que hello-world/argo-cd (aws-eks-cluster/k8s/ingress.yaml)
# via group.name eks-demo-apps - sin esto, cada Ingress nuevo crearia su
# propio Application Load Balancer (costo extra por hora + LCU). El
# certificado ACM es real, provisionado en aws-eks-cluster (ver acm.tf,
# aws_acm_certificate.demo_apps["podinfo"]). Sin anotacion certificate-arn:
# el AWS Load Balancer Controller lo descubre solo por el host de spec.tls,
# asi el repo no lleva el account ID ni el ARN.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  annotations:
    checkov.io/skip1: "CKV_K8S_21=namespace default a proposito, mismo criterio que el resto de este repo - ver CLAUDE.md"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/group.name: eks-demo-apps
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - podinfo.aws.jalcalaroot.com
  rules:
    - host: podinfo.aws.jalcalaroot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podinfo
                port:
                  number: 80
