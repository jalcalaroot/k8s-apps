apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

# Publica en https://podinfo.aws.jalcalaroot.com via el ALB compartido con
# hello-world/argo-cd - host-based routing, no path-based (ver README/
# CLAUDE.md sobre por que: ALB no reescribe path prefixes sin la feature
# nueva de URL rewrite, que no verificamos con sintaxis real).
replicas:
  - name: podinfo
    count: 2

namespace: default
