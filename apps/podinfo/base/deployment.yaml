# podinfo (github.com/stefanprodan/podinfo) - app de referencia del propio
# creador de Flux, usada por CNCF (Flux, Flagger) para pruebas end-to-end de
# GitOps. La usamos acá por el mismo motivo: es la app "de verdad" mas
# estandar para probar que el pipeline GitOps funciona, sin tener que
# mantener nosotros una imagen custom solo para el demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app: podinfo
  # A diferencia de Terraform, Checkov para Kubernetes NO usa comentarios
  # "#checkov:skip=" - necesita annotations checkov.io/skipN en el metadata
  # del recurso (confirmado contra la doc oficial de Checkov, no adivinado
  # despues de que la sintaxis de Terraform no funcionara acá).
  annotations:
    checkov.io/skip1: "CKV_K8S_43=pin a digest requiere el sha256 real de la imagen (docker inspect/crane digest al momento de actualizar) - hardcodear un digest sin verificarlo es peor que no tenerlo, se deja el tag semver por ahora"
    checkov.io/skip2: "CKV_K8S_21=namespace default a proposito para el ejemplo base - un namespace propio necesita un Fargate Profile nuevo en aws-eks-cluster/eks.tf primero (ver CLAUDE.md), no se agrega sin ese paso de infra"
    checkov.io/skip3: "CKV2_K8S_6=NetworkPolicy en Fargate no esta verificado (soporte real de node-level enforcement sin nodos EC2 no confirmado) - no se agrega una policy que podria no aplicarse de verdad, en vez de asumir que funciona"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
      # CKV2_K8S_6 evalua el Pod derivado del template, no el Deployment -
      # se repite el skip acá por si Checkov lo asocia al metadata del pod
      # en vez de al del Deployment.
      annotations:
        checkov.io/skip1: "CKV2_K8S_6=NetworkPolicy en Fargate no esta verificado (soporte real de node-level enforcement sin nodos EC2 no confirmado) - no se agrega una policy que podria no aplicarse de verdad, en vez de asumir que funciona"
    spec:
      # Sin nodeSelector/tolerations ni namespace especial - igual que
      # hello-world en aws-eks-cluster, el targeting a Fargate lo decide el
      # Fargate Profile (namespace "default", ya existe). Si esta app se
      # muda a otro namespace, hay que agregar un Fargate Profile nuevo en
      # aws-eks-cluster/eks.tf primero - sin eso el pod queda Pending para
      # siempre (ver README/CLAUDE.md).
      # securityContext a nivel POD (Checkov CKV_K8S_29 pide esto ademas del
      # de nivel container) - UID/GID alto no-root explicito (evita colisión
      # con UIDs del host, CKV_K8S_40) y seccomp RuntimeDefault (CKV_K8S_31).
      # 65534 = "nobody", funciona con la imagen de podinfo sin cambios.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      # podinfo no llama a la API de Kubernetes - sin necesidad del token de
      # su ServiceAccount montado (CKV_K8S_38).
      automountServiceAccountToken: false
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9898
            - name: http-metrics
              containerPort: 9797
          # podinfo trae sus propios endpoints de health - los usamos en vez
          # de inventar uno.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          # Fargate redondea a la combinacion soportada mas cercana de
          # vCPU/memoria - requests == limits por prolijidad, mismo criterio
          # que el resto del cluster.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
