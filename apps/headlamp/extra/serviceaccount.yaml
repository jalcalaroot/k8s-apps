# ServiceAccount dedicada para que un humano genere su propio token de
# login de Headlamp - separada a proposito de la ServiceAccount que trae
# el pod de Headlamp (esa la maneja el chart, ver bootstrap/headlamp-application.yaml
# donde se desactiva su ClusterRoleBinding a cluster-admin, que viene
# activado por default en el chart). "view" es el ClusterRole nativo de
# Kubernetes de solo lectura (sin Secrets) - suficiente para navegar el
# cluster desde la UI sin poder modificarlo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
  annotations:
    checkov.io/skip1: "CKV_K8S_21=namespace default a proposito, mismo criterio que el resto de este repo - ver CLAUDE.md"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: default
---
# Un Secret type=service-account-token es la forma soportada de obtener
# un token de larga duracion para una ServiceAccount (desde 1.24, los
# tokens ya no se generan automaticamente) - alternativa a
# `kubectl create token`, que expira a los 10 minutos por default y no
# alcanza para pegarlo una vez en el login de Headlamp y quedar logueado.
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-viewer-token
  annotations:
    kubernetes.io/service-account.name: headlamp-viewer
    checkov.io/skip1: "CKV_K8S_21=namespace default a proposito, mismo criterio que el resto de este repo - ver CLAUDE.md"
type: kubernetes.io/service-account-token
